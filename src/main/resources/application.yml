spring:
  datasource:
    url: jdbc:sqlite:./hospital.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
    hikari:
      jdbc-url: jdbc:sqlite:./hospital.db
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 9090
coze:
  api:
    url: ${COZE_API_URL:http://localhost:8000/api/coze/chat}
    key: ${COZE_API_KEY:}
  workflow:
    id: ${COZE_WORKFLOW_ID:}

llm:
  api:
    base-url: ${LLM_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    key: ${LLM_API_KEY:ark-7c5a1fda-aea0-4e24-9f28-1e0faf3e451b-67fb7}
    model: ${LLM_MODEL:ep-20260811021418-cxvdz}
    max-tokens: ${LLM_MAX_TOKENS:1024}
    temperature: ${LLM_TEMPERATURE:0.7}
    timeout-seconds: ${LLM_TIMEOUT:60}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-string}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
  init:
    admin:
      enabled: ${INIT_ADMIN_ENABLED:true}
      email: ${INIT_ADMIN_EMAIL:admin@hospital.local}
      password: ${INIT_ADMIN_PASSWORD:Admin123!}
      full-name: ${INIT_ADMIN_FULL_NAME:System Admin}
  analytics:
    enabled: ${ANALYTICS_ENABLED:false}
    datasource:
      url: jdbc:sqlite:./hospital.db
      driver-class-name: org.sqlite.JDBC
      username:
      password:

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
