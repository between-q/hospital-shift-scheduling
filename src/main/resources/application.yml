spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./hospital.db}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER-CLASS-NAME:org.sqlite.JDBC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      jdbc-url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:./hospital.db}
      driver-class-name: ${SPRING_DATASOURCE_DRIVER-CLASS-NAME:org.sqlite.JDBC}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:9090}

coze:
  api:
    url: ${COZE_API_URL:http://localhost:8000/api/coze/chat}
    key: ${COZE_API_KEY:}
  workflow:
    id: ${COZE_WORKFLOW_ID:}

llm:
  api:
    base-url: ${LLM_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    max-tokens: ${LLM_MAX_TOKENS:1024}
    temperature: ${LLM_TEMPERATURE:0.7}
    timeout-seconds: ${LLM_TIMEOUT:60}

security:
  jwt:
    secret: ${JWT_SECRET:MyHospitalShiftSchedulingJWTSecretKey2026VeryLongAndSecureString}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173}
  init:
    admin:
      enabled: ${INIT_ADMIN_ENABLED:true}
      email: ${INIT_ADMIN_EMAIL:admin@hospital.local}
      password: ${INIT_ADMIN_PASSWORD:Admin123!}
      full-name: ${INIT_ADMIN_FULL_NAME:System Admin}
  analytics:
    enabled: ${ANALYTICS_ENABLED:false}
    datasource:
      url: jdbc:sqlite:./hospital.db
      driver-class-name: org.sqlite.JDBC
      username:
      password:

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
